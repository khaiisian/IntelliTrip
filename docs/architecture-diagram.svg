      .external { fill: #fffdf7; stroke: #d97706; stroke-width: 1.5; rx: 8; }
      .db { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
      .title { font: 700 20px Arial, sans-serif; fill: #1d4ed8; }
      .text { font: 15px Arial, sans-serif; fill: #1e40af; }
      .small { font: 13px Arial, sans-serif; fill: #1e40af; }
      .extTitle { font: 700 17px Arial, sans-serif; fill: #b45309; }
      .arrow { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrowText { font: 13px Arial, sans-serif; fill: #1d4ed8; }
    </style>
  </defs>

  <rect x="20" y="40" width="245" height="500" class="layer"/>
